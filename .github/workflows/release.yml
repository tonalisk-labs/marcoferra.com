name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  # Each run its own group: a shared one keeps a single run waiting and cancels any older one.
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

# kit's workflow bounds each of its jobs with timeout-minutes, which a calling job can't set.
jobs:
  release:
    uses: tonalisk-labs/kit/.github/workflows/release.yml@e8636eb871366ea75d130f04276c4d6ce12af8b3 # v1.1.1-1-ge8636eb
    permissions:
      contents: write # to tag and attach the release
      id-token: write # to sign the attestations
      attestations: write # to store the attestations
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
    with:
      pages: true
  # The site goes to Pages once a release is made, and only this job may deploy it.
  pages:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: tonalisk-labs/kit/.github/workflows/pages.yml@e8636eb871366ea75d130f04276c4d6ce12af8b3 # v1.1.1-1-ge8636eb
    permissions:
      pages: write # to deploy the site
      id-token: write # to prove where the deployment comes from
